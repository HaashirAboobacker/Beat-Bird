<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Beat Bird — Rhythm Flappy Bird</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0d0c1d;
      color: #f0f4f8;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 4 / 3;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 65, 130, 0.25);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Mute button floating overlay */
    #mute-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(18, 16, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: background 0.2s, transform 0.1s;
      backdrop-filter: blur(4px);
    }
    #mute-btn:hover {
      background: rgba(255, 65, 130, 0.8);
      transform: scale(1.08);
    }
    #mute-btn:active {
      transform: scale(0.95);
    }
    #load-audio-btn {
      position: absolute;
      top: 14px;
      right: 64px;
      height: 42px;
      padding: 0 12px;
      border-radius: 21px;
      background: rgba(18, 16, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
      transition: background 0.2s, transform 0.1s;
      backdrop-filter: blur(4px);
    }
    #load-audio-btn:hover {
      background: rgba(0, 240, 255, 0.35);
      border-color: #00f0ff;
      transform: scale(1.05);
    }
    .audio-tag-hint {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
      z-index: 10;
      font-family: monospace;
    }
    #volume-toggle-btn {
      position: absolute;
      top: 62px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(18, 16, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: background 0.2s, transform 0.1s;
      backdrop-filter: blur(4px);
    }
    #volume-toggle-btn:hover {
      background: rgba(0, 240, 255, 0.35);
      border-color: #00f0ff;
      transform: scale(1.08);
    }
    #volume-toggle-btn.active {
      background: rgba(0, 240, 255, 0.45);
      border-color: #00f0ff;
    }
    #volume-panel {
      position: absolute;
      top: 110px;
      right: 14px;
      width: 175px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(18, 16, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #volume-panel.hidden {
      display: none;
    }
    .volume-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .volume-row label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.85);
    }
    .volume-row label span.val {
      color: #00f0ff;
      font-family: monospace;
    }
    .volume-row input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }
    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
      cursor: pointer;
    }
    .volume-row input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: none;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
      cursor: pointer;
    }
    #sfx-volume::-webkit-slider-thumb { background: #ff2a8a; box-shadow: 0 0 6px rgba(255, 42, 138, 0.8); }
    #sfx-volume::-moz-range-thumb { background: #ff2a8a; box-shadow: 0 0 6px rgba(255, 42, 138, 0.8); }
    #difficulty-slider::-webkit-slider-thumb { background: #ffaa00; box-shadow: 0 0 6px rgba(255, 170, 0, 0.8); }
    #difficulty-slider::-moz-range-thumb { background: #ffaa00; box-shadow: 0 0 6px rgba(255, 170, 0, 0.8); }
    #speed-slider::-webkit-slider-thumb { background: #a06bff; box-shadow: 0 0 6px rgba(160, 107, 255, 0.8); }
    #speed-slider::-moz-range-thumb { background: #a06bff; box-shadow: 0 0 6px rgba(160, 107, 255, 0.8); }
    .panel-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      color: rgba(255, 255, 255, 0.38);
      margin-top: 2px;
    }
    .panel-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin: 3px 0 1px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <input type="file" id="audio-file-input" accept="audio/*" style="display:none">
    <button id="load-audio-btn" title="Choose or drag-and-drop your audio file">📁 Load MP3</button>
    <button id="mute-btn" title="Toggle Mute (M)">🔊</button>
    <button id="volume-toggle-btn" title="Settings">⚙️</button>
    <div id="volume-panel" class="hidden">
      <div class="panel-section-label">AUDIO</div>
      <div class="volume-row">
        <label for="music-volume">🎵 MUSIC <span class="val" id="music-val">65%</span></label>
        <input type="range" id="music-volume" min="0" max="100" value="65">
      </div>
      <div class="volume-row">
        <label for="sfx-volume">💥 EFFECTS <span class="val" id="sfx-val">90%</span></label>
        <input type="range" id="sfx-volume" min="0" max="100" value="90">
      </div>
      <div class="panel-divider"></div>
      <div class="panel-section-label">GAMEPLAY</div>
      <div class="volume-row">
        <label for="difficulty-slider">🎯 DIFFICULTY <span class="val" id="difficulty-val">Normal</span></label>
        <input type="range" id="difficulty-slider" min="0" max="100" value="90">
      </div>
      <div class="volume-row">
        <label for="speed-slider">⚡ LEVEL SPEED <span class="val" id="speed-val">1.0x</span></label>
        <input type="range" id="speed-slider" min="0" max="100" value="50">
      </div>
    </div>
    <div id="audio-hint" class="audio-tag-hint">Checking audio source...</div>
  </div>

  <!-- Real track audio element. Relative path per specification -->
  <audio id="bgm" src="without_me.mp3" preload="auto"></audio>

  let audioCtx = null;
  let masterGain = null;
  let musicGain = null;    // controls bgm track + fallback synth drum beat
  let sfxGain = null;      // controls flap/collect/crash/scratch one-shots
  let isMuted = false;
  let hasRealAudio = false;
  let audioUsingFallback = false;
  let musicVolume = 0.65;
  let sfxVolume = 0.9;

  const bgm = document.getElementById('bgm');

  const musicSlider = document.getElementById('music-volume');
  const sfxSlider = document.getElementById('sfx-volume');
  const volumeToggleBtn = document.getElementById('volume-toggle-btn');

  // Virtual clock state (used if without_me.mp3 is missing or fails to load)
  let virtualClockStart = 0;
  let virtualCurrentTime = 0;
  let isAudioPlaying = false;

  // Real-time Instrumental Beat Dropout & DJ Scratch System
  let bgmSourceNode = null;
  let bgmBeatFilter = null;
  let beatDropOutUntil = 0;

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = isMuted ? 0 : 0.85;
      masterGain.connect(audioCtx.destination);

      musicGain = audioCtx.createGain();
      musicGain.gain.value = musicVolume;
      musicGain.connect(masterGain);

      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = sfxVolume;
      sfxGain.connect(masterGain);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    setupBgmMediaRouting();
    bgm.volume = musicVolume;
  }

  function setupBgmMediaRouting() {
    if (!audioCtx || bgmSourceNode) return;
    try {
      bgmSourceNode = audioCtx.createMediaElementSource(bgm);
      // Highpass filter: when frequency is 20Hz, song plays in full fidelity (full kick/bass/vocal).
      // When an orb is missed: frequency ramps up to 550Hz, removing the low-end kick and bassline (beat drops out)
      // while allowing Eminem's vocal frequency range (mids) to keep playing continuously!
      bgmBeatFilter = audioCtx.createBiquadFilter();
      bgmBeatFilter.type = 'highpass';
      bgmBeatFilter.frequency.setValueAtTime(20, audioCtx.currentTime);

      bgmSourceNode.connect(bgmBeatFilter);
      bgmBeatFilter.connect(musicGain);
    } catch(e) {
      // Direct playback fallback if CORS restricted (e.g. running directly via file:/// protocol)
      console.warn("Direct audio routing fallback:", e);
    }
  }

  function triggerBeatDropOut() {
    beatDropOutUntil = performance.now() + 1500; // Drop beat for ~1.5s
    if (audioCtx && bgmBeatFilter) {
      try {
        const now = audioCtx.currentTime;
        bgmBeatFilter.frequency.cancelScheduledValues(now);
        bgmBeatFilter.frequency.setValueAtTime(bgmBeatFilter.frequency.value, now);
        bgmBeatFilter.frequency.exponentialRampToValueAtTime(580, now + 0.04);
      } catch(e) {}
    }
  }

  function restoreBeat() {
    beatDropOutUntil = 0;
    if (audioCtx && bgmBeatFilter) {
      try {
        const now = audioCtx.currentTime;
        bgmBeatFilter.frequency.cancelScheduledValues(now);
        bgmBeatFilter.frequency.setValueAtTime(bgmBeatFilter.frequency.value, now);
        bgmBeatFilter.frequency.exponentialRampToValueAtTime(20, now + 0.18);
      } catch(e) {}
    }
  }

  // ============================================================================
  // BEAT DETECTION — analyzes a user-loaded audio file so obstacles/orbs sync
  // to that track's actual drums/beats instead of the hardcoded default clock.
  // ============================================================================
  // Lightweight energy-based onset detector:
  //  1. Mix down to mono.
  //  2. Cheap one-pole low-pass filter to emphasize kick/bass content.
  //  3. Compute a short-window RMS energy envelope (~20ms windows).
  //  4. Flag a beat wherever a window's energy spikes well above the local
  //     rolling average (a "spectral flux"-style onset trigger), with a
  //     minimum spacing so we don't double-trigger on one hit.
  async function analyzeTrackForBeats(arrayBuffer) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const decodeCtx = audioCtx || new AudioContextClass();
    const audioBuffer = await decodeCtx.decodeAudioData(arrayBuffer.slice(0));

    const sampleRate = audioBuffer.sampleRate;
    const length = audioBuffer.length;
    const channels = audioBuffer.numberOfChannels;

    // Mix down to mono
    const mono = new Float32Array(length);
    for (let c = 0; c < channels; c++) {
      const data = audioBuffer.getChannelData(c);
      for (let i = 0; i < length; i++) mono[i] += data[i] / channels;
    }

    // Cheap low-pass (one-pole IIR) to emphasize bass/kick-drum energy
    const filtered = new Float32Array(length);
    const alpha = 0.06;
    let prev = 0;
    for (let i = 0; i < length; i++) {
      prev += alpha * (mono[i] - prev);
      filtered[i] = prev;
    }

    // Short-window RMS energy envelope (~20ms per window)
    const windowSize = Math.max(64, Math.floor(sampleRate * 0.02));
    const numWindows = Math.floor(length / windowSize);
    const energies = new Float32Array(numWindows);
    for (let w = 0; w < numWindows; w++) {
      let sum = 0;
      const start = w * windowSize;
      for (let i = 0; i < windowSize; i++) {
        const v = filtered[start + i];
        sum += v * v;
      }
      energies[w] = Math.sqrt(sum / windowSize);
    }

    // Onset detection: local rolling average over ~1s history, threshold multiplier
    const historyWindows = Math.max(4, Math.round(1.0 / 0.02));
    const minIntervalSec = 0.22; // cap ~270 BPM to avoid double-triggering
    const beatTimes = [];
    let lastBeatTime = -Infinity;
    let rollingSum = 0;

    for (let w = 0; w < numWindows; w++) {
      const histStart = Math.max(0, w - historyWindows);
      let sum = 0;
      for (let k = histStart; k < w; k++) sum += energies[k];
      const cnt = w - histStart;
      const localAvg = cnt > 0 ? sum / cnt : 0;
      const timeSec = (w * windowSize) / sampleRate;
      const ratio = localAvg > 0.00001 ? energies[w] / localAvg : 0;

      if (ratio > 1.35 && energies[w] > 0.0006 && (timeSec - lastBeatTime) >= minIntervalSec) {
        beatTimes.push({ time: timeSec, strength: ratio });
        lastBeatTime = timeSec;
      }
    }

    let beats = beatTimes;
    // Fallback: if too few onsets were found (very quiet/ambient track),
    // synthesize an even 120 BPM grid so the game still has something to play.
    if (beats.length < 8) {
      beats = [];
      const period = 0.5; // 120 BPM
      for (let t = 0.5; t < audioBuffer.duration - 0.3; t += period) {
        beats.push({ time: t, strength: 1.5 });
      }
    }

    // Estimate BPM from the median inter-beat interval
    let bpm = 0;
    if (beats.length > 1) {
      const intervals = [];
      for (let i = 1; i < beats.length; i++) intervals.push(beats[i].time - beats[i - 1].time);
      intervals.sort((a, b) => a - b);
      const median = intervals[Math.floor(intervals.length / 2)];
      bpm = median > 0 ? Math.round(60 / median) : 0;
    }

    return { duration: audioBuffer.duration, beats, bpm };
  }

    hasRealAudio = true;

    audioHint.textContent = "Audio: without_me.mp3 (Synced)";

  // Sound synthesis functions using Web Audio API
  function playFlapSound() {
    if (!audioCtx || isMuted) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.08);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.09);
    } catch(e) {}
  }

  // Pentatonic scale arpeggio notes for beat orb collection
  const COLLECT_PITCHES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.50, 1174.66];

  // Catchy pop-up tags — shown occasionally (not every orb) when collection is going well
  const COLLECT_CATCHPHRASES = [
    "ON FIRE!", "IN THE POCKET!", "SMOOTH OPERATOR!", "GOT RHYTHM!",
    "VIBING!", "GROOVY!", "CRUISING!", "LOCKED IN!", "FEEL THE BEAT!", "NICE FLOW!"
  ];

  // Extra phrases for missed orbs, picked at random for variety
  const MISS_PHRASES = [

  ];

  function playCollectSound(combo) {
    if (!audioCtx || isMuted) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      const freq = COLLECT_PITCHES[combo % COLLECT_PITCHES.length];
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.23);
    } catch(e) {}
  }

  function playCrashSound() {
    if (!audioCtx || isMuted) return;
    try {
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, now);
      filter.frequency.exponentialRampToValueAtTime(80, now + 0.3);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(sfxGain);
      noise.start(now);
    } catch(e) {}
  }

  // Authentic DJ Record Scratch & CD Laser Skip noise
  function playDJScratchSound() {
    if (!audioCtx || isMuted) return;
    try {
      const now = audioCtx.currentTime;
      // 1. Static CD skip / needle scratch noise buffer
      const bufferSize = Math.floor(audioCtx.sampleRate * 0.26);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const stutter = Math.sin(i / 130) > 0 ? 1 : 0.2;
        data[i] = (Math.random() * 2 - 1) * stutter * Math.exp(-i / (bufferSize * 0.4));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      // Resonant bandpass filter sweeping rapidly like a vinyl backspin
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 5.5;
      bp.frequency.setValueAtTime(2400, now);
      bp.frequency.linearRampToValueAtTime(700, now + 0.07);
      bp.frequency.linearRampToValueAtTime(2600, now + 0.15);
      bp.frequency.exponentialRampToValueAtTime(450, now + 0.26);

      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.75, now);
      nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);

      noise.connect(bp);
      bp.connect(nGain);
      nGain.connect(sfxGain);
      noise.start(now);

      // 2. Vinyl friction glide tone (pitch-bent sawtooth)
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(70, now + 0.11);
      osc.frequency.linearRampToValueAtTime(340, now + 0.20);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.26);

      oscGain.gain.setValueAtTime(0.35, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

      osc.connect(oscGain);
      oscGain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.27);
    } catch(e) {}
  }

  // Synthesized drum beats for fallback mode
  function playSyntheticDrums(isSnare) {
    if (!audioCtx || isMuted || !audioUsingFallback) return;

    try {
      const now = audioCtx.currentTime;
      if (!isSnare) {
        // Kick
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.09);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(musicGain);
        osc.start(now);
        osc.stop(now + 0.13);
      } else {
        // Snare
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(musicGain);
        osc.start(now);
        osc.stop(now + 0.11);
      }
    } catch(e) {}
  }

  // Track File Picker and Drag-and-Drop Loader
  const loadAudioBtn = document.getElementById('load-audio-btn');

  function loadAudioFile(file) {
    if (!file) return;
    initAudioContext();
    const objectUrl = URL.createObjectURL(file);
    bgm.src = objectUrl;
    bgm.load();
    hasRealAudio = true;
    audioUsingFallback = false;
    currentTrackLabel = file.name;
    useCustomBeatMap = false;
    customBeatTimes = [];
    customBeatIndex = 0;
    isAnalyzingBeats = true;
    audioHint.textContent = `Analyzing beats in ${file.name}...`;
    audioHint.style.color = "#00f0ff";

    file.arrayBuffer().then(buf => analyzeTrackForBeats(buf)).then(result => {
      customBeatTimes = result.beats;
      customTrackDuration = result.duration;
      // Leave a little breathing room before the true end for the victory trigger,
      // and taper obstacle spawns over the final ~5s like the default track does.
      customVictoryTime = Math.max(1, customTrackDuration - 0.3);
      customTaperStart = Math.max(0, customTrackDuration - 5.0);
      useCustomBeatMap = true;
      isAnalyzingBeats = false;
      currentTrackSummary = `${result.bpm || '?'} BPM · ${result.beats.length} beats detected`;
      audioHint.textContent = `Audio: ${currentTrackLabel} — ${currentTrackSummary}`;
      audioHint.style.color = "#00ff88";
    }).catch(err => {
      // Analysis failed (unsupported format, etc.) — fall back to the default fixed beat clock
      console.warn("Beat analysis failed:", err);
      useCustomBeatMap = false;
      isAnalyzingBeats = false;
      audioHint.textContent = `Audio: ${file.name} (beat analysis unavailable — using default clock)`;
      audioHint.style.color = "#ffdd00";
    });

    if (gameState === STATE.PLAYING) {
      bgm.play().catch(e => {});
    }
  }

          audioHint.style.color = "#00ff88";

  // ============================================================================

  let tierRampBeatCount = 999; // start fully ramped so the opening tier isn't throttled
  const TIER_RAMP_BEATS = 8;

  let orbCollectStreak = 0;

  let gameStartTimestamp = 0;

  let customBeatTimes = [];       // [{ time: seconds, strength: energy ratio }]
  let customBeatIndex = 0;        // pointer into customBeatTimes during playback
  let customTrackDuration = 0;

  function getTaperStart() { return useCustomBeatMap ? customTaperStart : TAPER_START; }

  // Player Bird
  const bird = {
    x: 170,
    y: 300,
    vy: 0,
    angle: 0,
    wingAngle: 0,
    trail: [],
    lastFlapAt: -99999,
    reset() {
      this.x = 170;
      this.y = 300;
      this.vy = 0;
      this.angle = 0;
      this.wingAngle = 0;
      this.trail = [];
      this.lastFlapAt = -99999;
    },
    flap() {
      this.vy = FLAP_IMPULSE;
      this.lastFlapAt = performance.now();
      playFlapSound();
      // Flap particle puff
      for (let i = 0; i < 4; i++) {
        particles.push(new Particle(this.x - 14, this.y + (Math.random() * 8 - 4), -1.5, Math.random() * 2 - 1, '#ffffff', 4, 0.5));
      }
    },
    update() {
      this.vy += GRAVITY;
      if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
      this.y += this.vy;

      // Target angle smoothly interpolates based on velocity
      const targetAngle = Math.min(Math.PI / 2.6, Math.max(-Math.PI / 6, this.vy * 0.08));
      this.angle += (targetAngle - this.angle) * 0.2;

      // Wing flap animation
      this.wingAngle = Math.sin(performance.now() * 0.02) * 0.5 + (this.vy < 0 ? -0.4 : 0.2);

      // Store trail points
      if (Math.random() > 0.3) {
        this.trail.push({ x: this.x - 12, y: this.y, alpha: 0.6, size: 5 });
      }
      for (let i = this.trail.length - 1; i >= 0; i--) {
        this.trail[i].x -= 3;
        this.trail[i].alpha -= 0.035;
        this.trail[i].size *= 0.94;
        if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
      }
    },
    draw() {
      // Draw trail
      ctx.save();
      for (const t of this.trail) {
        ctx.fillStyle = `rgba(0, 240, 255, ${t.alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Glow effect around flyer
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = combo > 4 ? 18 : 8;

      if (birdSpriteReady) {
        // DJ Bird sprite (character reference) — mostly static pose, with a

        const sinceFlap = performance.now() - this.lastFlapAt;

        ctx.drawImage(
          birdSpriteImg,
          frame * BIRD_SPRITE_FRAME_W, 0, BIRD_SPRITE_FRAME_W, BIRD_SPRITE_FRAME_H,
          -BIRD_DRAW_W / 2, -BIRD_DRAW_H / 2, BIRD_DRAW_W, BIRD_DRAW_H
        );
      } else {
        // Fallback vector bird (in case the sprite hasn't loaded yet)
        ctx.fillStyle = '#ffde59';
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff914d';
        ctx.beginPath();
        ctx.ellipse(-2, 3, 14, 8, 0, 0, Math.PI * 2);

  // Obstacles (Planes and Eagles)
  let obstacles = [];
  let beatOrbs = [];
  let particles = [];
  let floatingTexts = [];
  let beatRings = [];

  // ============================================================================
  // INDEPENDENT MOVING OBSTACLES: PLANES, RAVENS & EAGLES (COMING FROM RIGHT)
  // ============================================================================
  class FlyingObstacle {
    constructor(x, y, type, isSwooper = false, targetY = null) {
      this.x = x;
      this.baseY = y;
      this.y = y;
      this.type = type; // 'plane', 'raven', or 'eagle'
      this.isSwooper = isSwooper;
      this.targetY = targetY !== null ? targetY : y;
      this.width = type === 'plane' ? 94 : (type === 'raven' ? 88 : 84);
      this.height = type === 'plane' ? 32 : (type === 'raven' ? 36 : 38);
      this.phase = Math.random() * Math.PI * 2;
      this.swoopProgress = 0;
      this.angle = 0;
      this.timeAlive = 0;
    }

    update(speed) {
      this.x -= speed;
      this.timeAlive += 0.05;

      if (this.type === 'eagle') {
        if (this.isSwooper) {
          this.swoopProgress += 0.022;
          const dive = Math.sin(Math.min(Math.PI, this.swoopProgress * Math.PI)) * 75;
          this.y = this.baseY + dive;
          this.angle = Math.sin(this.swoopProgress * Math.PI) * 0.45;
        } else {
          // Gentle undulating flight bob
          this.y = this.baseY + Math.sin(this.timeAlive * 4 + this.phase) * 14;
          this.angle = Math.cos(this.timeAlive * 4 + this.phase) * 0.12;
        }
      } else if (this.type === 'raven') {
        // Raven: flies straight like a plane with smooth horizontal glide
        this.y = this.baseY;
        this.angle = Math.sin(this.timeAlive * 2.5 + this.phase) * 0.05;

        // Dark purple mystical mist/feather particles trailing behind to the right
        if (Math.random() < 0.28) {
          particles.push(new Particle(
            this.x + 36,
            this.y + (Math.random() * 6 - 3),
            1.2 + Math.random() * 0.8,
            (Math.random() - 0.5) * 0.4,
            'rgba(168, 85, 247, 0.5)',
            3.5 + Math.random() * 2,
            0.38
          ));
        }
      } else {
        // Plane: flies straight with jet flame and vapor contrail
        this.y = this.baseY;
        this.angle = 0;

        if (Math.random() < 0.28) {
          particles.push(new Particle(
            this.x + 36,
            this.y + (Math.random() * 4 - 2),
            1.2 + Math.random() * 0.8,
            (Math.random() - 0.5) * 0.4,
            'rgba(200, 235, 255, 0.45)',
            3 + Math.random() * 2,
            0.35
          ));
        }
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      if (this.type === 'plane') {
        this.drawPlane();
      } else if (this.type === 'raven') {
        this.drawRaven();
      } else {
        this.drawEagle();
      }

      ctx.restore();
    }

    drawPlane() {
      // Modern Jet Plane flying from RIGHT to LEFT
      // Nose points left (-X), Jet exhaust points right (+X)

      // 1. Dual Afterburner Jet Flames (shooting to the right)
      const flicker = Math.sin(performance.now() * 0.04) * 4;
      const flameLen = 16 + flicker;
      const gradFlame = ctx.createLinearGradient(32, 0, 32 + flameLen, 0);
      gradFlame.addColorStop(0, '#ffffff');
      gradFlame.addColorStop(0.25, '#00f0ff');
      gradFlame.addColorStop(0.7, '#ff0055');

  // Beat Collectible Orbs
  class BeatOrb {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.radius = 15;
      this.collected = false;
      this.missed = false;
      this.pulsePhase = Math.random() * Math.PI * 2;
    }

    update(speed) {
      this.x -= speed;
      this.pulsePhase += 0.08;

      // Check if missed
      if (!this.collected && !this.missed && this.x < bird.x - 30) {
        this.missed = true;
        combo = 0;
        playDJScratchSound();
        triggerBeatDropOut();
        const missPhrase = MISS_PHRASES[Math.floor(Math.random() * MISS_PHRASES.length)];
        floatingTexts.push(new FloatingText(missPhrase, bird.x, bird.y - 35, '#ff0055'));
        screenShake = 7;
      }
    }

    draw() {
      if (this.collected) return;

      ctx.save();
      const pulse = Math.sin(this.pulsePhase) * 3;
      const r = this.radius + pulse;

      // Outer rhythmic glow
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;

      // Concentric halo
      ctx.strokeStyle = `rgba(0, 240, 255, ${0.4 + Math.sin(this.pulsePhase) * 0.3})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r + 7, 0, Math.PI * 2);
      ctx.stroke();

      // Orb body gradient
      const grad = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, '#00f0ff');
      grad.addColorStop(1, '#ff007f');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Musical eighth-note icon inside orb
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♫', this.x, this.y);

      ctx.restore();
    }
  }

  // Visual Particle FX
  class Particle {
    constructor(x, y, vx, vy, color, size, life) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.size = size;
      this.life = life;
      this.maxLife = life;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 0.02;
    }
    draw() {
      if (this.life <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Expanding beat-pulse ring — spawned on every beat at bird position so players can see the tempo visually
  class BeatRing {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.radius = 14;
      this.color = color || '#00f0ff';
      this.alpha = 0.7;
    }
    update() {
      this.radius += 3.5;
      this.alpha -= 0.045;
    }
    draw() {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Floating text feedback (+10, COMBO x4, etc.)
  class FloatingText {
    constructor(text, x, y, color) {
      this.text = text;
      this.x = x;
      this.y = y;
      this.color = color;
      this.alpha = 1.0;
      this.vy = -1.2;
    }
    update() {
      this.y += this.vy;
      this.alpha -= 0.025;
    }
    draw() {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.font = 'bold 16px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      ctx.fillText(this.text, this.x, this.y);
      ctx.restore();
    }
  }

  // ============================================================================
  // SPAWNING & RHYTHM SYSTEM
  // ============================================================================

  // Background Parallax Decorators
  const stars = [];
  for (let i = 0; i < 70; i++) {
    stars.push({
      x: Math.random() * CANVAS_WIDTH,
      y: Math.random() * (CANVAS_HEIGHT - 100),
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.4 + 0.1
    });
  }

  const clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * CANVAS_WIDTH,
      y: 40 + Math.random() * 180,
      width: 90 + Math.random() * 70,
      height: 35 + Math.random() * 20,
      speed: 0.6 + Math.random() * 0.4
    });
  }

  function getCurrentSection(t) {
    for (const sec of SECTIONS) {
      if (t >= sec.start && t < sec.end) {
        return sec;
      }
    }
    return SECTIONS[SECTIONS.length - 1];
  }

  let lastObstacleY = 300;
  let lastOrbY = 220;

  // Find an altitude for an obstacle that guarantees at least 85px clearance from nearby obstacles/orbs.
  // Uses a true random pick among safe candidates so obstacles distribute evenly across the full canvas height.
  function findSafeObstacleY(spawnX) {
    const candidates = [80, 135, 190, 250, 310, 370, 430, 490, 540];
    const nearbyOrbs = beatOrbs.filter(orb => Math.abs(orb.x - spawnX) < 140 && !orb.collected);
    const nearbyObs = obstacles.filter(obs => Math.abs(obs.x - spawnX) < 140);

    const safe = candidates.filter(candY => {
      // Stay within canvas vertical bounds
      if (candY < 60 || candY > CANVAS_HEIGHT - 55) return false;
      for (const orb of nearbyOrbs) {
        if (Math.abs(orb.y - candY) < 90) return false;
      }
      for (const obs of nearbyObs) {
        if (Math.abs(obs.y - candY) < 80) return false;
      }
      return true;
    });

    if (safe.length > 0) {
      // True random pick — avoids the top/bottom ping-pong caused by always picking farthest-from-last
      const chosen = safe[Math.floor(Math.random() * safe.length)];
      lastObstacleY = chosen;
      return chosen;
    }

    // Fallback: pick the candidate with the most clearance from nearby entities
    let bestY = candidates[Math.floor(Math.random() * candidates.length)], maxDist = -1;
    for (const candY of candidates) {
      let d = Infinity;
      for (const orb of nearbyOrbs) d = Math.min(d, Math.abs(orb.y - candY));
      for (const obs of nearbyObs) d = Math.min(d, Math.abs(obs.y - candY));
      if (d > maxDist) { maxDist = d; bestY = candY; }
    }
    lastObstacleY = bestY;
    return bestY;
  }

  // Find an altitude for a beat orb that guarantees at least 90px clearance from any nearby obstacle.
  // Uses a true random pick so orbs distribute evenly across the full canvas height.
  function findSafeOrbY(spawnX) {
    const candidates = [90, 150, 210, 270, 330, 390, 450, 510];
    const nearbyObs = obstacles.filter(obs => Math.abs(obs.x - spawnX) < 140);

    const safe = candidates.filter(candY => {
      if (candY < 60 || candY > CANVAS_HEIGHT - 55) return false;
      for (const obs of nearbyObs) {
        if (Math.abs(obs.y - candY) < 90) return false;
      }
      return true;
    });

    if (safe.length > 0) {
      // True random pick among safe slots — avoids top/bottom clustering
      const chosen = safe[Math.floor(Math.random() * safe.length)];
      lastOrbY = chosen;
      return chosen;
    }

    // Fallback: pick slot with most clearance
    let bestY = candidates[Math.floor(Math.random() * candidates.length)], maxDist = -1;
    for (const candY of candidates) {
      let d = Infinity;
      for (const obs of nearbyObs) d = Math.min(d, Math.abs(obs.y - candY));
      if (d > maxDist) { maxDist = d; bestY = candY; }
    }
    lastOrbY = bestY;
    return bestY;
  }

  function pickObstacleType(tier) {
    const r = Math.random();
    if (tier === 1) {
      // Tier 1: 50% Plane, 50% Raven (both straight-flying)
      return r < 0.5 ? 'plane' : 'raven';
    } else if (tier === 2) {
      // Tier 2: 35% Plane, 35% Raven, 30% Eagle
      if (r < 0.35) return 'plane';
      if (r < 0.70) return 'raven';
      return 'eagle';
    } else {
      // Tier 3: 40% Eagle (swooper), 30% Raven, 30% Plane
      if (r < 0.40) return 'eagle';
      if (r < 0.70) return 'raven';
      return 'plane';
    }
  }

  function onBeat(beatNumber, tier, currentTrackTime, opts) {
    opts = opts || {};
    const forceOrb = !!opts.forceOrb;
    const immediateOrb = !!opts.immediateOrb;
    backgroundPulse = 1.0;

    // Check if we are in the end taper phase
    const taperStart = getTaperStart();
    const victoryTime = getVictoryTime();
    if (currentTrackTime >= taperStart) {
      const taperProgress = (currentTrackTime - taperStart) / Math.max(0.001, (victoryTime - taperStart));
      if (Math.random() < taperProgress) {
        return; // Linearly taper obstacle spawn rate to zero
      }
    }

    const tConfig = TIER_CONFIG[tier];
    const isSnare = (beatNumber % 2 === 1);
    playSyntheticDrums(isSnare);
    // Visual beat-pulse ring at the bird so the player can see/feel the tempo
    beatRings.push(new BeatRing(bird.x, bird.y, isSnare ? '#ff2a8a' : '#00f0ff'));

    // Ease obstacle density in whenever the theme/tier just changed
    tierRampBeatCount = Math.min(tierRampBeatCount + 1, 9999);
    const rampFactor = Math.min(1, tierRampBeatCount / TIER_RAMP_BEATS);
    const diffFactor = getDifficultyFactor();

    // Obstacle spawn cadence: separate, individual, guaranteed non-overlapping
    // (thinned out overall, further eased in right after a theme change, and
    // scaled by the difficulty slider)
    if (tier === 1) {
      // Tier 1: 1 obstacle every 3 beats
      if (beatNumber % 3 === 0 && Math.random() < Math.min(1, (0.5 + 0.5 * rampFactor) * diffFactor)) {
        const type = pickObstacleType(tier);
        const spawnX = CANVAS_WIDTH + 50;
        const y = findSafeObstacleY(spawnX);
        obstacles.push(new FlyingObstacle(spawnX, y, type));
      }
    } else if (tier === 2) {
      // Tier 2: 1 obstacle every 3 beats, plus a staggered second obstacle every 6th beat
      if (beatNumber % 3 === 0 && Math.random() < Math.min(1, (0.5 + 0.5 * rampFactor) * diffFactor)) {
        const type = pickObstacleType(tier);
        const spawnX = CANVAS_WIDTH + 50;
        const y = findSafeObstacleY(spawnX);
        obstacles.push(new FlyingObstacle(spawnX, y, type));

        // Staggered second obstacle (separated horizontally by 170px), only once the ramp has built up
        if (beatNumber % 6 === 0 && Math.random() < Math.min(1, rampFactor * diffFactor)) {
          const type2 = pickObstacleType(tier);
          const spawnX2 = CANVAS_WIDTH + 220;
          const y2 = findSafeObstacleY(spawnX2);
          obstacles.push(new FlyingObstacle(spawnX2, y2, type2));
        }
      }
    } else if (tier === 3) {
      // Tier 3: beat-synced spawns every 2nd beat (thinned from every beat)
      if (beatNumber % 2 === 0 && Math.random() < Math.min(1, (0.55 + 0.45 * rampFactor) * diffFactor)) {
        const type = pickObstacleType(tier);
        const isSwooper = (type === 'eagle' && Math.random() < 0.65);
        const spawnX = CANVAS_WIDTH + 50;
        const y = findSafeObstacleY(spawnX);
        obstacles.push(new FlyingObstacle(spawnX, y, type, isSwooper, bird.y));
      }

      // Extra staggered obstacle on some snare beats, gated so it only appears once ramped up
      if (beatNumber % 4 === 1 && Math.random() < Math.min(1, 0.5 * rampFactor * diffFactor)) {
        const type2 = pickObstacleType(tier);
        const spawnX2 = CANVAS_WIDTH + 210;
        const y2 = findSafeObstacleY(spawnX2);
        obstacles.push(new FlyingObstacle(spawnX2, y2, type2));
      }
    }

    // Beat Orb Collectible Spawning (♫) — Beat-synchronized arrival
    // Orbs are pre-spawned so they arrive at bird.x=170 exactly when the beat fires.
    // Travel distance: from spawnX to bird.x at scrollSpeed px/frame (60fps).
    // We spawn on beat (N - preBeats) so the orb reaches bird.x on beat N.
    // In practice: each call to onBeat() places an orb at
    //   x = bird.x + (preBeats * BEAT_PERIOD * scrollSpeed * 60)
    // so it will slide into the player's lane exactly on a beat boundary.
    if (forceOrb || beatNumber % tConfig.orbInterval === 0) {
      if (immediateOrb) {
        // Custom track mode: tempo isn't constant/pre-known, so we spawn the
        // orb right at the edge on this detected beat rather than trying to
        // precisely pre-place it for a future beat arrival.
        const orbX = CANVAS_WIDTH + 60;
        const orbY = findSafeOrbY(orbX);
        beatOrbs.push(new BeatOrb(orbX, orbY));
      } else {
        const scrollSpeed = BASE_SPEED * tConfig.speedMult * getSpeedFactor();
        // How many frames does it take an orb at x=CANVAS_WIDTH+60 to reach bird.x?
        const travelFrames = (CANVAS_WIDTH + 60 - bird.x) / scrollSpeed;
        // Round to nearest multiple of (BEAT_PERIOD * 60) frames to snap to a future beat
        const framesPerBeat = BEAT_PERIOD * 60;
        const preBeats = Math.round(travelFrames / framesPerBeat);
        // Pre-place orb so it arrives at bird.x exactly preBeats from now
        const orbX = bird.x + preBeats * framesPerBeat * scrollSpeed;
        const orbY = findSafeOrbY(orbX);
        beatOrbs.push(new BeatOrb(orbX, orbY));
      }
    }
  }

  // ============================================================================
  // COLLISION DETECTION
  // ============================================================================
  function checkCollisions() {
    // 1. Ground and Ceiling Bounds
    if (bird.y - BIRD_HITBOX_RADIUS <= 0 || bird.y + BIRD_HITBOX_RADIUS >= CANVAS_HEIGHT - 35) {
      triggerGameOver("Crashed into boundary!");
      return;
    }

    // 2. Individual Obstacle Collisions (Planes, Ravens, and Eagles)
    for (const obs of obstacles) {
      const rx = obs.width * 0.42;
      const ry = obs.height * 0.42;
      const dx = bird.x - obs.x;
      const dy = bird.y - obs.y;
      const normDist = (dx * dx) / ((rx + BIRD_HITBOX_RADIUS) * (rx + BIRD_HITBOX_RADIUS)) +
                       (dy * dy) / ((ry + BIRD_HITBOX_RADIUS) * (ry + BIRD_HITBOX_RADIUS));
      if (normDist <= 1.0) {
        let name = "a Plane";
        if (obs.type === 'raven') name = "a Raven";
        else if (obs.type === 'eagle') name = "an Eagle";
        triggerGameOver(`Crashed into ${name}!`);
        return;
      }
    }

    // 3. Beat Orb Collectible collision
    for (const orb of beatOrbs) {
      if (!orb.collected && !orb.missed) {
        const dx = bird.x - orb.x;
        const dy = bird.y - orb.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < BIRD_HITBOX_RADIUS + orb.radius) {
          orb.collected = true;
          restoreBeat();
          score += 10;
          combo += 1;
          if (combo > maxCombo) maxCombo = combo;

          // Blip SFX removed — a very small screen shake replaces it so it doesn't compete with the music
          screenShake = Math.max(screenShake, 3);

          // Particle burst
          for (let i = 0; i < 14; i++) {
            const ang = (Math.PI * 2 / 14) * i;
            const spd = 2.5 + Math.random() * 2;
            particles.push(new Particle(orb.x, orb.y, Math.cos(ang) * spd, Math.sin(ang) * spd, '#00f0ff', 4, 0.45));
          }

          floatingTexts.push(new FloatingText(`+10 ${combo > 1 ? 'x' + combo : ''}`, orb.x, orb.y - 12, '#00ff88'));

          // Catchy pop-up tag — only every few orbs collected, not every single one
          orbCollectStreak++;
          if (orbCollectStreak >= nextCatchphraseAt) {
            const phrase = COLLECT_CATCHPHRASES[Math.floor(Math.random() * COLLECT_CATCHPHRASES.length)];
            floatingTexts.push(new FloatingText(phrase, bird.x, bird.y - 42, '#ffdd00'));
            orbCollectStreak = 0;
            nextCatchphraseAt = 3 + Math.floor(Math.random() * 3);
          }
        }
      }
    }
  }

  function circleRectOverlap(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (r * r);
  }

  function triggerGameOver(reason) {
    gameState = STATE.GAMEOVER;
    updateOverlayVisibility();
    survivalTimeMs = Date.now() - gameStartTimestamp;
    stopAudioPlayback();
    playCrashSound();
    screenShake = 22;

    // Crash debris particles
    for (let i = 0; i < 25; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 5;
      particles.push(new Particle(bird.x, bird.y, Math.cos(ang) * spd, Math.sin(ang) * spd, '#ff3366', 5, 0.7));
    }

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('beatflyer_highscore', highScore.toString());
    }
    if (maxCombo > bestComboRecord) {
      bestComboRecord = maxCombo;
      localStorage.setItem('beatflyer_maxcombo', bestComboRecord.toString());
    }
  }

  function triggerVictory() {
    gameState = STATE.VICTORY;
    updateOverlayVisibility();
    survivalTimeMs = Date.now() - gameStartTimestamp;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('beatflyer_highscore', highScore.toString());
    }
    if (maxCombo > bestComboRecord) {
      bestComboRecord = maxCombo;
      localStorage.setItem('beatflyer_maxcombo', bestComboRecord.toString());
    }
  }

  // ============================================================================
  // RENDER SYSTEM
  // ============================================================================
  function render(trackTime) {
    ctx.save();

    // Screen Shake effect
    if (screenShake > 0) {
      const sx = (Math.random() * 2 - 1) * screenShake;
      const sy = (Math.random() * 2 - 1) * screenShake;
      ctx.translate(sx, sy);
      screenShake *= 0.88;
      if (screenShake < 0.5) screenShake = 0;
    }

    // 1. Dynamic Background Sky Gradient depending on Section Tier
    const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    if (currentTier === 3) {
      // Tier 3 Peak: Deep Neon Red / Synthwave Crimson
      const flash = backgroundPulse * 0.15;
      skyGrad.addColorStop(0, `rgb(${45 + flash * 80}, 8, 28)`);
      skyGrad.addColorStop(0.7, `rgb(${22 + flash * 40}, 6, 18)`);
      skyGrad.addColorStop(1, '#050308');
    } else if (currentTier === 2) {
      // Tier 2 Ramp: Sunset Violet to Warm Pink
      skyGrad.addColorStop(0, '#241038');
      skyGrad.addColorStop(0.6, '#46153c');
      skyGrad.addColorStop(1, '#11051b');
    } else {
      // Tier 1 Easy/Breather: Deep Twilight Indigo
      skyGrad.addColorStop(0, '#0d1527');
      skyGrad.addColorStop(0.7, '#15243f');
      skyGrad.addColorStop(1, '#080d1a');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Stars layer
    ctx.fillStyle = '#ffffff';
    for (const star of stars) {
      star.x -= star.speed;
      if (star.x < 0) star.x = CANVAS_WIDTH;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Distant City Skyline Silhouettes
    ctx.fillStyle = currentTier === 3 ? '#1a0814' : '#0e1628';
    for (let i = 0; i < CANVAS_WIDTH; i += 50) {
      const h = 40 + ((i * 37) % 65);
      ctx.fillRect(i, CANVAS_HEIGHT - 35 - h, 46, h);
    }

    // Scrolling Clouds
    ctx.fillStyle = currentTier === 3 ? 'rgba(255, 42, 109, 0.12)' : 'rgba(255, 255, 255, 0.08)';
    for (const cl of clouds) {
      cl.x -= cl.speed;
      if (cl.x + cl.width < 0) cl.x = CANVAS_WIDTH + 20;
      ctx.beginPath();
      ctx.ellipse(cl.x, cl.y, cl.width / 2, cl.height / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. Obstacles & Beat Orbs
    for (const obs of obstacles) {
      obs.draw();
    }
    for (const orb of beatOrbs) {
      orb.draw();
    }

    // 3. Particles, Floating texts & Beat Rings
    for (const p of particles) {
      p.draw();
    }
    for (const ft of floatingTexts) {
      ft.draw();
    }
    for (const br of beatRings) {
      br.draw();
    }

    // 4. Ground & Ceiling with Synthwave Rhythm Grid
    drawGroundAndCeiling();

    // 5. Player Flyer
    bird.draw();

    // 6. UI & HUD
    drawHUD(trackTime);

    // Fade background beat pulse
    backgroundPulse *= 0.92;

    ctx.restore();
  }

  let groundOffset = 0;
  function drawGroundAndCeiling() {
    groundOffset = (groundOffset + 3.2) % 40;

    // Ground block
    ctx.fillStyle = '#080614';
    ctx.fillRect(0, CANVAS_HEIGHT - 35, CANVAS_WIDTH, 35);

    // Ceiling bar
    ctx.fillStyle = '#080614';
    ctx.fillRect(0, 0, CANVAS_WIDTH, 8);

    // Neon Ground Grid lines
    ctx.strokeStyle = currentTier === 3 ? '#ff2a6d' : (currentTier === 2 ? '#ffdd00' : '#00f0ff');
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, CANVAS_HEIGHT - 35);
    ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT - 35);
    ctx.moveTo(0, 8);
    ctx.lineTo(CANVAS_WIDTH, 8);
    ctx.stroke();

    // Ground vertical rhythm teeth
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    for (let x = -groundOffset; x < CANVAS_WIDTH; x += 30) {
      ctx.moveTo(x, CANVAS_HEIGHT - 35);
      ctx.lineTo(x - 12, CANVAS_HEIGHT);
    }
    ctx.stroke();
  }

  function drawHUD(trackTime) {
    if (gameState === STATE.START) {
      drawStartScreen();
      return;
    }

    // HUD: Score Top-Left
    ctx.save();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.fillText(`SCORE ${score}`, 24, 40);

    // Section Name & Tier Indicator Dot
    const tConfig = TIER_CONFIG[currentTier];
    ctx.font = '600 13px monospace';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fillText(`${currentSectionName.toUpperCase()}`, 24, 60);

    // Tier dot
    ctx.beginPath();
    ctx.arc(14, 34, 5, 0, Math.PI * 2);
    ctx.fillStyle = tConfig.color;
    ctx.fill();
    ctx.shadowColor = tConfig.color;
    ctx.shadowBlur = 8;
    ctx.stroke();

    // HUD: Combo Counter Top-Right
    ctx.textAlign = 'right';
    if (combo > 0) {
      const comboColor = combo >= 10 ? '#ff0055' : (combo >= 5 ? '#ffaa00' : '#00ffcc');
      ctx.fillStyle = comboColor;
      ctx.font = 'bold 24px "Segoe UI", sans-serif';
      ctx.shadowColor = comboColor;
      ctx.shadowBlur = 10;
      ctx.fillText(`COMBO x${combo}`, CANVAS_WIDTH - 70, 40);
    }

    // Song Progress Bar (Top edge)
    const progress = Math.min(1.0, trackTime / VICTORY_TIME);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, 4);
    ctx.fillStyle = tConfig.color;
    ctx.fillRect(0, 0, CANVAS_WIDTH * progress, 4);

    // Time readout
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    const curMin = Math.floor(trackTime / 60);
    const curSec = Math.floor(trackTime % 60).toString().padStart(2, '0');
    const totMin = Math.floor(VICTORY_TIME / 60);
    const totSec = Math.floor(VICTORY_TIME % 60).toString().padStart(2, '0');
    ctx.fillText(`${curMin}:${curSec} / ${totMin}:${totSec}`, CANVAS_WIDTH - 70, 58);

    ctx.restore();

    // Overlays
    if (gameState === STATE.GAMEOVER) {
      drawGameOverScreen();
    } else if (gameState === STATE.VICTORY) {
      drawVictoryScreen();
    }
  }

  function drawStartScreen() {

    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;

      `⚙️ Difficulty: ${getDifficultyLabel(difficultySliderValue)}   •   Speed: ${getSpeedFactor().toFixed(1)}x   (tap the gear icon to adjust)`,

    );

    ctx.restore();
  }

  function drawGameOverScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(10, 4, 15, 0.85)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    ctx.textAlign = 'center';

    // Title
    ctx.font = '900 46px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ff2a6d';
    ctx.shadowColor = '#ff2a6d';
    ctx.shadowBlur = 18;
    ctx.fillText("CRASHED!", CANVAS_WIDTH / 2, 150);

    // Results card
    const cardW = 380, cardH = 250;
    const cardX = CANVAS_WIDTH / 2 - cardW / 2, cardY = 180;
    ctx.fillStyle = 'rgba(255, 18, 40, 0.12)';
    ctx.strokeStyle = 'rgba(255, 42, 109, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 0;
    roundRect(ctx, cardX, cardY, cardW, cardH, 12);

    // Core stats
    ctx.font = '600 17px "Segoe UI", sans-serif';
    ctx.fillStyle = '#f0f4f8';
    ctx.fillText(`Final Score: ${score}`, CANVAS_WIDTH / 2, cardY + 40);
    ctx.fillText(`Best Score: ${highScore}`, CANVAS_WIDTH / 2, cardY + 70);
    ctx.fillText(`Max Combo: x${maxCombo}  (Record: x${bestComboRecord})`, CANVAS_WIDTH / 2, cardY + 100);

    // Divider separating stats from the "wasted time" callout
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cardX + 30, cardY + 122);
    ctx.lineTo(cardX + cardW - 30, cardY + 122);
    ctx.stroke();

    // "Wasted your life" — the headline joke stat, made big and bold
    const wastedTotalSeconds = Math.floor(survivalTimeMs / 1000);
    const wastedMinutes = Math.floor(wastedTotalSeconds / 60);
    const wastedSeconds = wastedTotalSeconds % 60;

    ctx.font = '700 14px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255, 179, 198, 0.8)';
    ctx.fillText("CONGRATS, YOU WASTED", CANVAS_WIDTH / 2, cardY + 152);

    ctx.font = '900 38px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffdd00';
    ctx.shadowColor = '#ffdd00';
    ctx.shadowBlur = 12;
    ctx.fillText(`${wastedMinutes}m ${wastedSeconds}s`, CANVAS_WIDTH / 2, cardY + 195);

    ctx.font = 'italic 600 15px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.shadowBlur = 0;
    ctx.fillText("of your life 💀", CANVAS_WIDTH / 2, cardY + 222);

    // Restart button
    const pulse = Math.sin(performance.now() * 0.007) * 3;
    ctx.font = 'bold 22px "Segoe UI", sans-serif';
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12 + pulse;
    ctx.fillText("CLICK TO RESTART", CANVAS_WIDTH / 2, cardY + cardH + 55 + pulse);

    ctx.restore();
  }

  function drawVictoryScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(5, 20, 15, 0.88)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    ctx.textAlign = 'center';
    ctx.font = '900 48px "Segoe UI", sans-serif';
    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 22;
    ctx.fillText("YOU MADE IT!", CANVAS_WIDTH / 2, 150);

    ctx.font = '700 18px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffdd00';
    ctx.shadowBlur = 8;
    ctx.fillText("FULL TRACK COMPLETED 🎵", CANVAS_WIDTH / 2, 182);

    // Results card
    const cardW = 380, cardH = 250;
    const cardX = CANVAS_WIDTH / 2 - cardW / 2, cardY = 210;
    ctx.fillStyle = 'rgba(18, 38, 28, 0.85)';
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 0;
    roundRect(ctx, cardX, cardY, cardW, cardH, 12);

    // Core stats
    ctx.font = '600 17px "Segoe UI", sans-serif';
    ctx.fillStyle = '#f0f4f8';
    ctx.fillText(`Final Score: ${score}`, CANVAS_WIDTH / 2, cardY + 40);
    ctx.fillText(`High Score: ${highScore}`, CANVAS_WIDTH / 2, cardY + 70);

    // Divider
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';

    ctx.moveTo(cardX + 30, cardY + 122);
    ctx.lineTo(cardX + cardW - 30, cardY + 122);
    ctx.stroke();

    // Time to complete — big, celebratory
    const finishTotalSeconds = Math.floor(survivalTimeMs / 1000);
    const finishMinutes = Math.floor(finishTotalSeconds / 60);
    const finishSeconds = finishTotalSeconds % 60;

    ctx.font = '700 14px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(180, 255, 220, 0.8)';
    ctx.fillText("YOU CONQUERED THE TRACK IN", CANVAS_WIDTH / 2, cardY + 152);

    ctx.font = '900 36px "Segoe UI", sans-serif';
    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 12;
    ctx.fillText(`${finishMinutes}m ${finishSeconds}s`, CANVAS_WIDTH / 2, cardY + 194);

    ctx.font = 'italic 600 15px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.shadowBlur = 0;
    ctx.fillText("not a second of it wasted 🎉", CANVAS_WIDTH / 2, cardY + 221);

    // Restart button
    const pulse = Math.sin(performance.now() * 0.007) * 3;
    ctx.font = 'bold 22px "Segoe UI", sans-serif';
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12 + pulse;
    ctx.fillText("CLICK TO PLAY AGAIN", CANVAS_WIDTH / 2, cardY + cardH + 55 + pulse);

    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // ============================================================================
  // GAME LOOP
  // ============================================================================
  let lastFrameTime = performance.now();

  function gameLoop(now) {
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    // Advance virtual timeline if using synthesized clock
    if (gameState === STATE.PLAYING) {
      if (!hasRealAudio || bgm.paused) {
        virtualCurrentTime += dt;
      }
    }

    // Check if beat dropout duration expired
    if (beatDropOutUntil > 0 && now >= beatDropOutUntil) {
      restoreBeat();
    }

    const trackTime = getTrackTime();

    if (gameState === STATE.PLAYING) {
      // 1. Check Victory condition
      if (trackTime >= getVictoryTime()) {
        triggerVictory();
      }

      // 2. Lookup current section & tier
      if (useCustomBeatMap) {
        // Custom track: no pre-baked section map, so keep whatever tier the
        // most recent detected beat assigned (set below) and label accordingly.
        currentSectionName = isAnalyzingBeats ? "Analyzing…" : "Custom Track";
      } else {
        const section = getCurrentSection(trackTime);
        currentSectionName = section.name;
        currentTier = section.tier;
        if (currentTier !== lastTierForRamp) {
          tierRampBeatCount = 0;
          lastTierForRamp = currentTier;
        }
      }

      // 3. Beat Clock event detection
      if (useCustomBeatMap) {
        // Fire onBeat() for every detected beat we've now reached, spawning
        // an orb on every single beat (many more orbs than the fixed clock).
        while (customBeatIndex < customBeatTimes.length && trackTime >= customBeatTimes[customBeatIndex].time) {
          const beatInfo = customBeatTimes[customBeatIndex];
          currentTier = beatInfo.strength > 1.9 ? 3 : (beatInfo.strength > 1.55 ? 2 : 1);
          if (currentTier !== lastTierForRamp) {
            tierRampBeatCount = 0;
            lastTierForRamp = currentTier;
          }
          onBeat(customBeatIndex, currentTier, trackTime, { forceOrb: true, immediateOrb: true });
          customBeatIndex++;
        }
      } else if (trackTime >= PHASE_OFFSET) {
        const beatNum = Math.floor((trackTime - PHASE_OFFSET) / BEAT_PERIOD);
        if (beatNum > lastProcessedBeat) {
          onBeat(beatNum, currentTier, trackTime);
          lastProcessedBeat = beatNum;
        }
      }

      // 4. Update Entities
      bird.update();

      const scrollSpeed = BASE_SPEED * TIER_CONFIG[currentTier].speedMult * getSpeedFactor();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.update(scrollSpeed);
        if (obs.x < -140) {
          obstacles.splice(i, 1);
        }
      }

      for (let i = beatOrbs.length - 1; i >= 0; i--) {
        const orb = beatOrbs[i];
        orb.update(scrollSpeed);
        if (orb.x < -50 || orb.collected) {
          beatOrbs.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.update();
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      for (let i = beatRings.length - 1; i >= 0; i--) {
        beatRings[i].update();
        if (beatRings[i].alpha <= 0) beatRings.splice(i, 1);
      }


      // 5. Collision detection
      checkCollisions();
    }

    // Render frame
    render(trackTime);

    requestAnimationFrame(gameLoop);
  }

  // ============================================================================
  // INPUT HANDLING & GAME RESET
  // ============================================================================
  function handleAction() {
    initAudioContext();

    if (gameState === STATE.START) {
      startGame();
    } else if (gameState === STATE.PLAYING) {
      bird.flap();
    } else if (gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) {
      restartGame();
    }
  }

  function startGame() {
    gameState = STATE.PLAYING;
    updateOverlayVisibility();
    restoreBeat();
    score = 0;
    combo = 0;
    maxCombo = 0;
    obstacles = [];
    beatOrbs = [];
    particles = [];
    floatingTexts = [];
    beatRings = [];
    lastProcessedBeat = -1;
    customBeatIndex = 0;
    orbCollectStreak = 0;
    nextCatchphraseAt = 3 + Math.floor(Math.random() * 3);
    lastTierForRamp = 1;
    tierRampBeatCount = 999;
    gameStartTimestamp = Date.now();
    survivalTimeMs = 0;
    bird.reset();
    bird.flap();
    startAudioPlayback();
  }

  function restartGame() {
    stopAudioPlayback();
    startGame();
  }

  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleAction();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });

  // Mouse / Touch controls
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleAction();
  });

  // Start animation loop
  requestAnimationFrame(gameLoop);

  </script>
